<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: MIT
     Updoit icon: an original penguin ("Doot") tooting a horn to announce updates. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="1" stop-color="#18a058"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d365"/>
      <stop offset="1" stop-color="#e09b1f"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- music notes -->
  <g fill="#ffffff" opacity="0.92">
    <circle cx="196" cy="70" r="9"/>
    <rect x="203" y="34" width="5" height="37" rx="2"/>
    <path d="M203 34 q14 4 16 18 q-6 -8 -16 -8z"/>
    <circle cx="222" cy="104" r="7"/>
    <rect x="227" y="76" width="4" height="29" rx="2"/>
  </g>

  <!-- body: slim, teal-slate penguin -->
  <ellipse cx="104" cy="160" rx="58" ry="70" fill="#1f2a44"/>
  <!-- belly with an update arrow -->
  <ellipse cx="108" cy="172" rx="38" ry="52" fill="#f4f7fb"/>
  <path d="M108 148 v34 m-14 -14 l14 14 l14 -14" stroke="#18a058" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="90" y="196" width="36" height="7" rx="3.5" fill="#18a058"/>

  <!-- head -->
  <circle cx="110" cy="92" r="44" fill="#1f2a44"/>
  <!-- face patch -->
  <ellipse cx="120" cy="98" rx="28" ry="26" fill="#f4f7fb"/>
  <!-- eye (squinting with effort) -->
  <path d="M110 86 q8 -7 16 0" stroke="#1f2a44" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- cheek -->
  <circle cx="108" cy="104" r="6" fill="#ff8fa3" opacity="0.7"/>

  <!-- short coral beak into the horn mouthpiece -->
  <path d="M136 98 l14 -4 l-1 12 z" fill="#ff7a45"/>

  <!-- horn (bugle) -->
  <rect x="146" y="96" width="34" height="8" rx="4" fill="url(#horn)"/>
  <path d="M176 92 L212 76 L212 124 L176 108 Z" fill="url(#horn)"/>
  <ellipse cx="212" cy="100" rx="7" ry="24" fill="#c97f10"/>

  <!-- flipper holding the horn -->
  <path d="M138 140 q30 -6 40 -30 q4 10 -2 18 q-14 22 -36 22 z" fill="#1f2a44"/>

  <!-- feet -->
  <ellipse cx="86" cy="228" rx="16" ry="6" fill="#ff7a45"/>
  <ellipse cx="124" cy="228" rx="16" ry="6" fill="#ff7a45"/>
</svg>
