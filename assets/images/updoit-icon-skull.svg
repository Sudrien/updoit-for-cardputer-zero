<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: MIT
     Updoit icon, skull variant: an original cartoon skull tooting a trumpet. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="1" stop-color="#18a058"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d365"/>
      <stop offset="1" stop-color="#e09b1f"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- music notes -->
  <g fill="#ffffff" opacity="0.92">
    <circle cx="200" cy="58" r="9"/>
    <rect x="207" y="24" width="5" height="35" rx="2"/>
    <path d="M207 24 q14 4 16 18 q-6 -8 -16 -8z"/>
    <circle cx="226" cy="214" r="7"/>
    <rect x="231" y="186" width="4" height="29" rx="2"/>
  </g>

  <!-- skull cranium -->
  <path d="M40 112 a62 60 0 0 1 124 0 q0 26 -16 40 v18 q0 8 -8 8 h-76 q-8 0 -8 -8 v-18 q-16 -14 -16 -40z"
        fill="#f4f1e8"/>
  <!-- eye sockets -->
  <ellipse cx="78" cy="114" rx="17" ry="19" fill="#1f2a44"/>
  <ellipse cx="128" cy="114" rx="17" ry="19" fill="#1f2a44"/>
  <!-- eye glints -->
  <circle cx="83" cy="108" r="4" fill="#ffffff"/>
  <circle cx="133" cy="108" r="4" fill="#ffffff"/>
  <!-- nose -->
  <path d="M103 132 l-7 13 h14 z" fill="#1f2a44"/>
  <!-- jaw with teeth -->
  <rect x="66" y="156" width="72" height="30" rx="10" fill="#f4f1e8"/>
  <g stroke="#1f2a44" stroke-width="3" stroke-linecap="round">
    <line x1="70" y1="168" x2="134" y2="168"/>
    <line x1="84" y1="160" x2="84" y2="176"/>
    <line x1="98" y1="160" x2="98" y2="176"/>
    <line x1="112" y1="160" x2="112" y2="176"/>
    <line x1="126" y1="160" x2="126" y2="176"/>
  </g>

  <!-- trumpet, from the mouth out to the right -->
  <rect x="128" y="164" width="16" height="9" rx="3" fill="#c97f10"/>
  <rect x="142" y="160" width="46" height="16" rx="6" fill="url(#brass)"/>
  <rect x="152" y="148" width="7" height="14" rx="3" fill="#e09b1f"/>
  <rect x="164" y="148" width="7" height="14" rx="3" fill="#e09b1f"/>
  <rect x="176" y="148" width="7" height="14" rx="3" fill="#e09b1f"/>
  <path d="M186 158 L226 136 L226 200 L186 178 Z" fill="url(#brass)"/>
  <ellipse cx="226" cy="168" rx="8" ry="32" fill="#c97f10"/>

  <!-- download arrow badge -->
  <circle cx="64" cy="214" r="24" fill="#f4f7fb"/>
  <path d="M64 200 v22 m-10 -10 l10 10 l10 -10" stroke="#18a058" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
